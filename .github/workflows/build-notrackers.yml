name: Build tracker-free RikkaHub APK

# Tap "Run workflow" in the Actions tab. About 15-25 minutes later the APK
# appears under Releases (tag: notrackers) and as a workflow artifact.
#
# The Firebase removal is not committed to the source tree on purpose: it is
# applied at build time from patches/*.patch, so merging upstream changes can
# never silently drop it, and an upstream change that breaks a patch fails the
# build loudly instead of producing a tracked APK.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build identity
        run: |
          echo "Fork commit:     $(git rev-parse --short HEAD)"
          echo "Upstream base:   $(git log -1 --format='%h %s' -- . ':!.github' ':!patches' ':!README.md' | head -1)"
          echo "App version:     $(grep -m1 'versionName' app/build.gradle.kts | tr -d ' ')"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # The :web module runs `pnpm run build` during preBuild and does not
      # install dependencies itself, so install them first.
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # ---- Apply the tracker-removal patches -------------------------------
      - name: Apply patches
        run: |
          shopt -s nullglob
          files=(patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No patches found in patches/"; exit 1
          fi
          for p in "${files[@]}"; do
            echo "::group::Applying $p"
            if git apply --verbose "$p"; then
              echo "applied cleanly"
            elif git apply --3way "$p"; then
              echo "applied with 3-way merge"
            else
              echo "::error file=$p::This patch no longer applies. Upstream most likely edited the same lines. Update the patch (see README, 'If a patch stops applying') and re-run."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Verify no Firebase remains
        run: |
          if grep -rniE "com\.google\.firebase|com\.google\.gms|google-services" \
               --include=*.kt --include=*.kts --include=*.toml . ; then
            echo "::error::Firebase references still present"; exit 1
          fi
          echo "Clean: no Firebase references in the tree."

      # A fresh signing key is generated for every run, so this build cannot
      # be replaced in place by an APK signed by anyone else. Consequence:
      # uninstall the old copy before installing a newer build.
      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/rikka-notrackers.keystore \
            -alias rikka-notrackers \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass rikkahub-notrackers \
            -keypass rikkahub-notrackers \
            -dname "CN=RikkaHub tracker-free, O=Personal build, C=IN"
          cat > local.properties <<'EOF'
          storeFile=${{ github.workspace }}/app/rikka-notrackers.keystore
          storePassword=rikkahub-notrackers
          keyAlias=rikka-notrackers
          keyPassword=rikkahub-notrackers
          EOF

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-notrackers-apk
          path: app/build/outputs/apk/github/release/*.apk
          retention-days: 30

      # Publishing to Releases means you can download the APK straight from
      # the Releases page in a phone browser, no login or unzip needed.
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: notrackers
          name: Tracker-free RikkaHub
          prerelease: true
          body: |
            Built from `${{ github.sha }}` with Firebase Analytics and
            Crashlytics removed and the update ping disabled.

            Install on Android 8.0+ (arm64 or x86_64). Uninstall any previous
            build of this fork first — each run is signed with a new key.
          files: app/build/outputs/apk/github/release/*.apk
