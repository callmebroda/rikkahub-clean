name: Sync upstream RikkaHub

# Keeps this fork on top of rikkahub/rikkahub.
#
# This workflow NEVER builds the APK — building is manual, on purpose, so no
# Actions time is spent unless you ask for it. All it does is:
#   1. merge rikkahub/rikkahub@master into this repo's master and push
#   2. dry-run the patches in patches/ to check they still apply
#
# If step 2 fails, the run goes red and names the patch: update that patch
# against the new upstream code, then run the build workflow yourself.
on:
  schedule:
    - cron: '0 3 * * *'   # daily, 03:00 UTC = 08:30 IST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          set -euo pipefail
          git config user.name "upstream-sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)

          git remote add upstream https://github.com/rikkahub/rikkahub.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging upstream $(git rev-parse --short upstream/master)"
          if git merge --no-edit upstream/master; then
            echo "Merged cleanly."
          else
            # README.md is this fork's own document and always differs.
            # Any other conflict has to be resolved by hand.
            conflicting=$(git diff --name-only --diff-filter=U)
            echo "Conflicts in: $conflicting"
            others=$(printf '%s\n' "$conflicting" | grep -vx 'README.md' || true)
            if [ -n "$others" ]; then
              echo "::error::Conflict outside README.md ($others). Resolve by hand, then re-run this workflow."
              exit 1
            fi
            git checkout --ours README.md
            git add README.md
            git commit --no-edit
            echo "Resolved README.md in favour of this fork."
          fi

          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin HEAD:master
            echo "Pushed upstream merge to master."
          fi

      # Dry run only: nothing is committed, nothing is built. This is the check
      # that tells you whether the patches still fit the synced upstream code.
      - name: Check the patches still apply
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No patches found in patches/"; exit 1
          fi

          failed=""
          for p in "${files[@]}"; do
            if git apply --check "$p" >/dev/null 2>&1; then
              echo "OK        $p"
            elif git apply --3way --check "$p" >/dev/null 2>&1; then
              echo "OK (3-way) $p"
            else
              echo "STALE     $p"
              failed="$failed $p"
            fi
          done
          git reset --hard -q

          if [ -n "$failed" ]; then
            echo "::error::Patch(es) no longer apply:$failed — update them before building. See README, 'If a patch stops applying'."
            exit 1
          fi
          echo "All patches still apply. Nothing was built — run the build workflow when you want an APK."
